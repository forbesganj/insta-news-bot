# Manual: Actions > check-setup > Run workflow. Verifies secrets, upstream tools and your Instagram token.
name: check-setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Doctor
        run: python -m newsroom.cli doctor
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'telegram' }}
          NEWSROOM_DB: /tmp/doctor.sqlite3
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upstream skill tools
        run: python -m newsroom.cli check-upstream || true
        env:
          NEWSROOM_DB: /tmp/doctor.sqlite3
